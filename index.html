<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remember How to Code</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root {
    --cream: #fffaf1;
    --paper: #fffdf8;
    --sage: #a9c7ad;
    --sage-dark: #62886b;
    --sage-light: #e5f0e2;
    --yellow: #f5d77d;
    --yellow-light: #fff3c9;
    --pink: #f2cbd3;
    --blue: #cfe2ed;
    --lavender: #ddd5eb;
    --brown: #50483f;
    --muted: #91887d;
    --line: #ece4d7;
    --dark: #292c29;
    --shadow: 0 12px 35px rgba(78, 68, 55, .08);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 8% 10%, rgba(245,215,125,.22), transparent 90px),
        radial-gradient(circle at 92% 85%, rgba(169,199,173,.3), transparent 120px),
        var(--cream);
    color: var(--brown);
    font-family: "DM Sans", sans-serif;
}

/* =========================================================
   OPENING ANIMATION
========================================================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #fffaf0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity .7s ease, visibility .7s ease;
}

#intro.hide {
    opacity: 0;
    visibility: hidden;
}

.intro-code {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: .12;
    font-family: monospace;
    color: #62886b;
    font-size: 17px;
    line-height: 2;
}

.intro-code span {
    position: absolute;
    white-space: nowrap;
    animation: codeFloat 7s linear infinite;
}

.intro-code .one {
    top: 15%;
    left: -20%;
}

.intro-code .two {
    top: 35%;
    left: -30%;
    animation-delay: 1.5s;
}

.intro-code .three {
    top: 62%;
    left: -25%;
    animation-delay: 3s;
}

.intro-code .four {
    top: 78%;
    left: -30%;
    animation-delay: 4.5s;
}

@keyframes codeFloat {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(145vw);
    }
}

.intro-content {
    position: relative;
    text-align: center;
    z-index: 3;
    animation: introAppear 1s ease both;
}

@keyframes introAppear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.intro-duck {
    width: 115px;
    height: 95px;
    margin: 0 auto 15px;
    position: relative;
    animation: duckFloat 2s ease-in-out infinite;
}

@keyframes duckFloat {
    0%, 100% {
        transform: translateY(0) rotate(-2deg);
    }
    50% {
        transform: translateY(-10px) rotate(2deg);
    }
}

.intro-duck .body {
    position: absolute;
    width: 76px;
    height: 55px;
    background: #f4d76e;
    border-radius: 55% 50% 48% 55%;
    left: 7px;
    bottom: 9px;
}

.intro-duck .head {
    position: absolute;
    width: 53px;
    height: 53px;
    background: #f8df82;
    border-radius: 50%;
    left: 54px;
    top: 2px;
}

.intro-duck .eye {
    position: absolute;
    width: 7px;
    height: 7px;
    background: #4d463e;
    border-radius: 50%;
    left: 91px;
    top: 22px;
}

.intro-duck .beak {
    position: absolute;
    width: 23px;
    height: 13px;
    background: #e5a148;
    border-radius: 80% 20% 20% 80%;
    left: 99px;
    top: 30px;
}

.intro-duck .wing {
    position: absolute;
    width: 38px;
    height: 24px;
    background: #e8cb61;
    border-radius: 60% 40% 60% 40%;
    left: 37px;
    bottom: 23px;
    transform: rotate(-15deg);
}

.intro-title {
    font-family: "Playfair Display", serif;
    font-size: clamp(38px, 7vw, 68px);
    line-height: 1;
    margin: 0;
    letter-spacing: -.8px;
}

.intro-title span {
    color: var(--sage-dark);
}

.intro-subtitle {
    margin: 14px 0 0;
    color: var(--muted);
    font-size: 15px;
}

.loading-line {
    width: 190px;
    height: 5px;
    background: #eee6d8;
    border-radius: 10px;
    overflow: hidden;
    margin: 27px auto 0;
}

.loading-fill {
    height: 100%;
    width: 0;
    background: var(--sage-dark);
    border-radius: inherit;
    animation: loading 2.1s ease forwards;
}

@keyframes loading {
    to {
        width: 100%;
    }
}

/* =========================================================
   HEADER
========================================================= */

header {
    height: 76px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    background: rgba(255,253,248,.93);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(14px);
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
}

.mini-duck {
    width: 40px;
    height: 33px;
    position: relative;
}

.mini-duck .body {
    position: absolute;
    width: 29px;
    height: 21px;
    background: var(--yellow);
    border-radius: 55%;
    left: 1px;
    bottom: 2px;
}

.mini-duck .head {
    position: absolute;
    width: 19px;
    height: 19px;
    background: #f8df82;
    border-radius: 50%;
    left: 18px;
    top: 1px;
}

.mini-duck .eye {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--brown);
    border-radius: 50%;
    left: 30px;
    top: 7px;
}

.mini-duck .beak {
    position: absolute;
    width: 8px;
    height: 5px;
    background: #e5a148;
    border-radius: 80% 20% 20% 80%;
    left: 35px;
    top: 10px;
}

.logo h1 {
    font-family: "Playfair Display", serif;
    font-size: 20px;
    margin: 0;
}

.logo h1 span {
    color: var(--sage-dark);
}

.streak {
    background: var(--yellow-light);
    border: 1px solid #efdda8;
    padding: 9px 15px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 13px;
}

/* =========================================================
   LAYOUT
========================================================= */

.app {
    max-width: 1450px;
    margin: auto;
    display: flex;
}

.sidebar {
    width: 245px;
    min-height: calc(100vh - 76px);
    padding: 25px 18px;
    background: rgba(255,253,248,.62);
    border-right: 1px solid var(--line);
}

.side-title {
    margin: 6px 12px 12px;
    color: #a0988e;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.language-button {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--brown);
    padding: 12px 13px;
    border-radius: 13px;
    font: inherit;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: .2s;
}

.language-button:hover {
    background: #f5f0e7;
}

.language-button.active {
    background: var(--sage-light);
    color: #4f7157;
}

.unit-list {
    margin-top: 25px;
}

.unit {
    padding: 9px 11px;
    margin: 3px 0;
    border-radius: 11px;
    color: #786f65;
    font-size: 12px;
    cursor: pointer;
    transition: .2s;
}

.unit:hover {
    background: #f5f0e7;
}

.unit.current {
    background: #e8f2e5;
    color: #55765b;
    font-weight: 700;
}

.unit.locked {
    opacity: .38;
    cursor: not-allowed;
}

.unit-number {
    display: inline-block;
    width: 24px;
    color: #aaa095;
    font-size: 10px;
}

main {
    flex: 1;
    min-width: 0;
    padding: 40px clamp(22px, 5vw, 65px);
}

/* =========================================================
   DASHBOARD
========================================================= */

.page {
    max-width: 930px;
    margin: auto;
}

.welcome {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 25px;
    margin-bottom: 29px;
}

.welcome h2 {
    font-family: "Playfair Display", serif;
    font-size: clamp(32px, 5vw, 48px);
    line-height: 1.02;
    margin: 0 0 9px;
}

.welcome p {
    color: var(--muted);
    margin: 0;
}

.progress-box {
    width: 190px;
}

.progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 7px;
}

.progress {
    height: 8px;
    background: #ece5da;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background: var(--sage-dark);
    border-radius: inherit;
    transition: width .5s;
}

.cards {
    display: grid;
    grid-template-columns: 1.3fr .7fr;
    gap: 17px;
    margin-bottom: 20px;
}

.card {
    background: rgba(255,255,255,.78);
    border: 1px solid var(--line);
    border-radius: 23px;
    padding: 25px;
    box-shadow: var(--shadow);
}

.continue-card {
    background: linear-gradient(135deg, #e4f0e1, #fff7dc);
}

.card-kicker {
    color: var(--sage-dark);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
}

.card h3 {
    font-family: "Playfair Display", serif;
    font-size: 24px;
    margin: 8px 0;
}

.card p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
}

.big-button,
.next-button {
    border: 0;
    background: var(--sage-dark);
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
}

.big-button:hover,
.next-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(98,136,107,.23);
}

.stats-card {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.stat {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px dashed #e6ded1;
    font-size: 13px;
}

.stat:last-child {
    border: 0;
}

.stat span {
    color: var(--muted);
}

/* =========================================================
   DUCK AREA
========================================================= */

.duck-area {
    height: 145px;
    position: relative;
    overflow: hidden;
    margin: 18px 0 27px;
    border: 1px solid #efdfb8;
    border-radius: 23px;
    background: linear-gradient(135deg, #fff5d4, #fff9e8);
}

.duck-area::after {
    content: "";
    position: absolute;
    width: 210px;
    height: 90px;
    border-radius: 50%;
    background: rgba(255,255,255,.48);
    right: -50px;
    bottom: -45px;
}

.duck-note {
    position: absolute;
    color: #c9b27b;
    font-family: Georgia, serif;
    font-size: 20px;
}

.duck {
    width: 65px;
    height: 58px;
    position: absolute;
    cursor: pointer;
    transition: transform .2s;
    z-index: 5;
}

.duck:hover {
    transform: scale(1.08) rotate(-4deg);
}

.duck .body {
    position: absolute;
    width: 44px;
    height: 32px;
    background: #f4d76e;
    border-radius: 55% 50% 48% 55%;
    bottom: 5px;
    left: 5px;
}

.duck .head {
    position: absolute;
    width: 31px;
    height: 31px;
    background: #f8df82;
    border-radius: 50%;
    top: 2px;
    left: 29px;
}

.duck .eye {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--brown);
    border-radius: 50%;
    top: 12px;
    left: 48px;
}

.duck .beak {
    position: absolute;
    width: 13px;
    height: 8px;
    background: #e5a148;
    border-radius: 80% 20% 20% 80%;
    top: 17px;
    left: 55px;
}

.duck .wing {
    position: absolute;
    width: 21px;
    height: 14px;
    background: #e9cb61;
    border-radius: 60% 40% 60% 40%;
    bottom: 12px;
    left: 21px;
    transform: rotate(-15deg);
}

.duck.clicked {
    animation: duckPop .38s forwards;
}

@keyframes duckPop {
    0% { transform: scale(1); opacity: 1; }
    65% { transform: scale(1.3) rotate(10deg); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
}

/* =========================================================
   LESSON LIST
========================================================= */

.section-title {
    margin: 25px 0 13px;
}

.section-title h3 {
    font-family: "Playfair Display", serif;
    font-size: 23px;
    margin: 0;
}

.lesson-list {
    display: grid;
    gap: 8px;
}

.lesson {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: rgba(255,255,255,.75);
    border: 1px solid var(--line);
    border-radius: 15px;
    transition: .2s;
}

.lesson.unlocked {
    cursor: pointer;
}

.lesson.unlocked:hover {
    transform: translateX(4px);
    box-shadow: 0 6px 18px rgba(78,68,55,.07);
}

.lesson.locked {
    opacity: .43;
}

.lesson-number {
    width: 35px;
    height: 35px;
    flex: 0 0 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1ede5;
    border-radius: 11px;
    font-size: 11px;
    font-weight: 800;
}

.lesson.completed .lesson-number {
    background: var(--sage);
    color: white;
}

.lesson-info {
    flex: 1;
}

.lesson-title {
    font-size: 14px;
    font-weight: 700;
}

.lesson-sub {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
}

.lesson-arrow {
    color: #a59d93;
}

/* =========================================================
   LESSON PAGE
========================================================= */

.lesson-page {
    max-width: 850px;
    margin: auto;
}

.back-button {
    border: 0;
    background: transparent;
    padding: 0;
    margin-bottom: 22px;
    color: var(--sage-dark);
    font: inherit;
    font-weight: 800;
    cursor: pointer;
}

.lesson-header {
    padding: 31px;
    border: 1px solid #dfe8db;
    border-radius: 25px;
    background: linear-gradient(135deg, #e7f2e3, #fff7dd);
    margin-bottom: 19px;
}

.lesson-tag {
    display: inline-block;
    padding: 6px 10px;
    background: rgba(255,255,255,.7);
    border-radius: 9px;
    color: var(--sage-dark);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.lesson-header h2 {
    font-family: "Playfair Display", serif;
    font-size: clamp(31px, 5vw, 44px);
    line-height: 1.05;
    margin: 14px 0 8px;
}

.lesson-header p {
    color: var(--muted);
    margin: 0;
}

.lesson-content {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 23px;
    padding: 31px;
    box-shadow: var(--shadow);
}

.lesson-content h3 {
    font-family: "Playfair Display", serif;
    font-size: 24px;
    margin: 0 0 10px;
}

.lesson-content p {
    color: #665e55;
    line-height: 1.72;
    font-size: 15px;
}

.code-label {
    margin-top: 25px;
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

.code-box {
    margin: 0;
    padding: 21px;
    background: var(--dark);
    color: #f7f3e8;
    border-radius: 15px;
    overflow-x: auto;
    font-family: Consolas, Monaco, monospace;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre;
}

.tip {
    margin-top: 19px;
    padding: 15px 17px;
    background: var(--yellow-light);
    border-left: 4px solid #e7c867;
    border-radius: 10px;
    color: #6e614b;
    font-size: 13px;
    line-height: 1.5;
}

.lesson-actions {
    margin-top: 24px;
    padding: 19px;
    border: 1px solid #d8e5d4;
    border-radius: 17px;
    background: #eef6eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.lesson-actions strong {
    display: block;
    margin-bottom: 3px;
}

.lesson-actions span {
    color: var(--muted);
    font-size: 12px;
}

/* =========================================================
   TEST
========================================================= */

.test-screen {
    max-width: 700px;
    margin: 25px auto;
}

.test-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 27px;
    padding: 35px;
    box-shadow: var(--shadow);
}

.test-card h2 {
    font-family: "Playfair Display", serif;
    font-size: 35px;
    margin: 8px 0;
}

.test-card > p {
    color: var(--muted);
    line-height: 1.65;
}

.test-progress {
    height: 7px;
    background: #ece5da;
    border-radius: 10px;
    overflow: hidden;
    margin: 25px 0;
}

.test-progress-bar {
    height: 100%;
    background: var(--sage-dark);
}

.question {
    font-size: 19px;
    line-height: 1.45;
    font-weight: 700;
    margin-bottom: 17px;
}

.answers {
    display: grid;
    gap: 9px;
}

.answer {
    border: 1px solid #e6ded2;
    background: #fffdf8;
    color: var(--brown);
    padding: 14px 15px;
    border-radius: 13px;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: .18s;
}

.answer:hover {
    border-color: #b4ccb7;
    background: #f0f6ee;
}

/* =========================================================
   FINISHED
========================================================= */

.finished {
    max-width: 650px;
    margin: 45px auto;
    text-align: center;
}

.finished-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 45px 30px;
    box-shadow: var(--shadow);
}

.finished-card h2 {
    font-family: "Playfair Display", serif;
    font-size: 40px;
    margin: 0 0 10px;
}

.finished-card p {
    color: var(--muted);
    line-height: 1.7;
}

/* =========================================================
   CONFETTI
========================================================= */

.confetti {
    position: fixed;
    width: 8px;
    height: 12px;
    z-index: 999;
    pointer-events: none;
    animation: confettiFly .9s ease-out forwards;
}

@keyframes confettiFly {
    from {
        transform: translate(0,0) rotate(0);
        opacity: 1;
    }
    to {
        transform: translate(var(--x),var(--y)) rotate(500deg);
        opacity: 0;
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    header {
        padding: 0 16px;
    }

    .sidebar {
        display: none;
    }

    main {
        padding: 25px 16px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .welcome {
        display: block;
    }

    .progress-box {
        width: 100%;
        margin-top: 20px;
    }

    .lesson-actions {
        flex-direction: column;
        align-items: stretch;
    }

    .next-button {
        width: 100%;
    }

    .lesson-content,
    .test-card {
        padding: 23px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     OPENING ANIMATION
===================================================== -->

<div id="intro">

    <div class="intro-code">
        <span class="one">let creativity = true;</span>
        <span class="two">print("Hello, coder!");</span>
        <span class="three">&lt;button&gt;Create&lt;/button&gt;</span>
        <span class="four">if (idea) { buildSomething(); }</span>
    </div>

    <div class="intro-content">

        <div class="intro-duck">
            <div class="body"></div>
            <div class="head"></div>
            <div class="eye"></div>
            <div class="beak"></div>
            <div class="wing"></div>
        </div>

        <h1 class="intro-title">
            Remember How to <span>Code</span>
        </h1>

        <p class="intro-subtitle">
            Learn it. Practice it. Build something cool.
        </p>

        <div class="loading-line">
            <div class="loading-fill"></div>
        </div>

    </div>

</div>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">

        <div class="mini-duck">
            <div class="body"></div>
            <div class="head"></div>
            <div class="eye"></div>
            <div class="beak"></div>
        </div>

        <h1>
            Remember How to <span>Code</span>
        </h1>

    </div>

    <div class="streak">
        ✦ <span id="streakNumber">0</span> day streak
    </div>

</header>

<div class="app">

<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="side-title">
        Languages
    </div>

    <button class="language-button active"
        onclick="changeLanguage('Python')">
        Python
    </button>

    <button class="language-button"
        onclick="changeLanguage('JavaScript')">
        JavaScript
    </button>

    <button class="language-button"
        onclick="changeLanguage('HTML')">
        HTML
    </button>

    <button class="language-button"
        onclick="changeLanguage('CSS')">

/* =========================================================

function lessonKey(unit, lesson) {
    return currentLanguage + "-" + unit + "-" + lesson;
}

function isCompleted(unit, lesson) {
    return completed[lessonKey(unit, lesson)] === true;
}

function completeStoredLesson(unit, lesson) {
    completed[lessonKey(unit, lesson)] = true;

    localStorage.setItem(
        "completedLessons",
        JSON.stringify(completed)
    );
}

function getPlacement() {
    return placements[currentLanguage] || null;
}

function getProgress() {

    let total = 0;

    for (let unit = 1; unit <= 10; unit++) {

        for (let lesson = 1; lesson <= 10; lesson++) {

            if (isCompleted(unit, lesson)) {
                total++;
            }

        }

    }

    return total;
}

/* =========================================================
   LOCKING
========================================================= */

function lessonUnlocked(unit, lesson) {

    const placement = getPlacement();

    if (!placement) {
        return false;
    }

    if (unit < placement) {
        return false;
    }

    if (unit === placement && lesson === 1) {
        return true;
    }

    if (lesson > 1) {
        return isCompleted(unit, lesson - 1);
    }

    return isCompleted(unit - 1, 10);
}

/* =========================================================

========================================================= */

function changeLanguage(language) {

/* =========================================================

function startPlacement() {

}

function answerTest(answer) {

    const question =
        placementQuestions[testIndex];

    if (
        answer !== question.correct &&
        testFirstWrong === null
    ) {
        testFirstWrong = testIndex + 1;
    }

    testIndex++;

    if (testIndex >= 10) {

        let startingUnit;

        if (testFirstWrong === null) {

            startingUnit = 10;

        } else {

            startingUnit =

        }

            startingUnit;

            "placements",
            JSON.stringify(placements)
        );

        currentUnit = startingUnit;

        return;

}

========================================================= */

    completeStoredLesson(
        currentUnit,
        currentLesson

    updateStreak();

    if (currentLesson < 10) {

        currentLesson++;

    } else if (currentUnit < 10) {

        currentUnit++;
        currentLesson = 1;

    } else {

        currentPage = "finished";
        render();
        return;
    }

    currentPage = "lesson";

    render();
}

/* =========================================================
   FIND NEXT LESSON
========================================================= */

function openNextAvailable() {

    const placement =
        getPlacement();

    if (!placement) {
        startPlacement();
        return;
    }

    for (
        let unit = placement;
        unit <= 10;
        unit++
    ) {

        for (
            let lesson = 1;
            lesson <= 10;
            lesson++
        ) {

            if (
                lessonUnlocked(unit, lesson) &&
                !isCompleted(unit, lesson)
            ) {

                openLesson(unit, lesson);
                return;
            }

        }

    }

    currentPage = "finished";
    render();
}

        localStorage.setItem(
            "lastCodingDay",
            today

    }
}

        list.innerHTML = "";

    let html = "";

    for (

        unit <= 10;
        unit++

        const unlocked =
            unit >= placement &&
            (
                unit === placement ||
                isCompleted(unit - 1, 10)
            );

            '<div class="unit ' +
            (unit === currentUnit ? "current " : "") +
            (unlocked ? "" : "locked") +

            unit +

            unitNames[unit - 1];

        html += '</div>';
    }

    list.innerHTML = html;

function openUnit(unit) {

        return;

    currentUnit = unit;

    for (
        let lesson = 1;
        lesson <= 10;
        lesson++

        if (
            lessonUnlocked(unit, lesson) &&
            !isCompleted(unit, lesson)
        ) {

            currentLesson = lesson;
            currentPage = "lesson";
            render();
            return;
        }

    }

/* =========================================================
   DUCK CONFETTI
========================================================= */

function duckClicked(duck) {

    if (duck.classList.contains("clicked")) {
        return;
    }

    const rect =
        duck.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    duck.classList.add("clicked");

    const colors = [
        "#f2cbd3",
        "#a9c7ad",
        "#f5d77d",
        "#cfe2ed",
        "#ddd5eb"
    ];

    for (
        let i = 0;
        i < 24;
        i++
    ) {

        const piece =
            document.createElement("div");

        piece.className = "confetti";

        piece.style.background =
            colors[i % colors.length];

        piece.style.left =
            centerX + "px";

        piece.style.top =
            centerY + "px";

        piece.style.setProperty(
            "--x",
            ((Math.random() * 180) - 90) + "px"
        );

        piece.style.setProperty(
            "--y",
            ((Math.random() * 150) - 75) + "px"
        );

        document.body.appendChild(piece);

        setTimeout(function() {
            piece.remove();
        }, 950);
    }

    setTimeout(function() {

        duck.classList.remove("clicked");

        duck.style.left =
            (5 + Math.random() * 82) + "%";

        duck.style.top =
            (20 + Math.random() * 55) + "%";

    }, 2200);
}

    }

    document
        .querySelectorAll(".language-button")
        .forEach(function(button) {

            button.classList.toggle(
                "active",
                button.textContent.trim() === currentLanguage
            );

        });

    renderUnits();

    document.getElementById(
        "streakNumber"
    ).textContent = streak;
}

/* =========================================================
   OPENING ANIMATION
========================================================= */

setTimeout(function() {

    const intro =
        document.getElementById("intro");

    intro.classList.add("hide");

}, 2500);

/* =========================================================
   START
========================================================= */

if (!getPlacement()) {
    currentPage = "test";
}

render();

</script>

</body>
</html>
