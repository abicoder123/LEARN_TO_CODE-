<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remember How to Code</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root{
    --cream:#fffaf1;
    --paper:#fffdf8;
    --sage:#a9c7ad;
    --sageDark:#62886b;
    --sageLight:#e5f0e2;
    --yellow:#f5d77d;
    --yellowLight:#fff3c9;
    --pink:#f2cbd3;
    --blue:#cfe2ed;
    --lavender:#ddd5eb;
    --brown:#50483f;
    --muted:#91887d;
    --line:#ece4d7;
    --dark:#292c29;
    --shadow:0 12px 35px rgba(78,68,55,.08);
}

*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 8% 10%,rgba(245,215,125,.22),transparent 90px),
        radial-gradient(circle at 92% 85%,rgba(169,199,173,.3),transparent 120px),
        var(--cream);
    color:var(--brown);
    font-family:"DM Sans",sans-serif;
}

/* INTRO */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#fffaf0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:.7s;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
}

.introCode{
    position:absolute;
    inset:0;
    opacity:.12;
    font:17px monospace;
    color:#62886b;
    line-height:2;
}

.introCode span{
    position:absolute;
    white-space:nowrap;
    animation:floatCode 7s linear infinite;
}

.introCode span:nth-child(1){top:15%;left:-20%}
.introCode span:nth-child(2){top:35%;left:-30%;animation-delay:1.5s}
.introCode span:nth-child(3){top:62%;left:-25%;animation-delay:3s}
.introCode span:nth-child(4){top:78%;left:-30%;animation-delay:4.5s}

@keyframes floatCode{
    from{transform:translateX(0)}
    to{transform:translateX(145vw)}
}

.introContent{
    position:relative;
    text-align:center;
    animation:introIn 1s ease;
}

@keyframes introIn{
    from{opacity:0;transform:translateY(25px) scale(.95)}
    to{opacity:1;transform:none}
}

.introDuck{
    width:115px;
    height:95px;
    margin:auto auto 15px;
    position:relative;
    animation:bob 2s ease-in-out infinite;
}

@keyframes bob{
    50%{transform:translateY(-10px) rotate(2deg)}
}

.introDuck .body{
    position:absolute;
    width:76px;
    height:55px;
    background:#f4d76e;
    border-radius:55%;
    left:7px;
    bottom:9px;
}

.introDuck .head{
    position:absolute;
    width:53px;
    height:53px;
    background:#f8df82;
    border-radius:50%;
    left:54px;
    top:2px;
}

.introDuck .eye{
    position:absolute;
    width:7px;
    height:7px;
    background:#4d463e;
    border-radius:50%;
    left:91px;
    top:22px;
}

.introDuck .beak{
    position:absolute;
    width:23px;
    height:13px;
    background:#e5a148;
    border-radius:80% 20% 20% 80%;
    left:99px;
    top:30px;
}

.introDuck .wing{
    position:absolute;
    width:38px;
    height:24px;
    background:#e8cb61;
    border-radius:60%;
    left:37px;
    bottom:23px;
    transform:rotate(-15deg);
}

.introTitle{
    font:600 clamp(38px,7vw,68px)/1 "Playfair Display",serif;
    margin:0;
}

.introTitle span{color:var(--sageDark)}

.introSubtitle{
    color:var(--muted);
    margin:14px 0 0;
}

.loading{
    width:190px;
    height:5px;
    background:#eee6d8;
    border-radius:10px;
    overflow:hidden;
    margin:27px auto 0;
}

.loadingFill{
    height:100%;
    width:0;
    background:var(--sageDark);
    animation:load 2.2s forwards;
}

@keyframes load{to{width:100%}}

/* HEADER */

header{
    height:76px;
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    background:rgba(255,253,248,.93);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo h1{
    font:600 20px "Playfair Display",serif;
    margin:0;
}

.logo h1 span{color:var(--sageDark)}

.logoDuck{
    width:38px;
    height:30px;
    position:relative;
}

.logoDuck .body{
    position:absolute;
    width:28px;
    height:20px;
    background:var(--yellow);
    border-radius:55%;
    left:1px;
    bottom:1px;
}

.logoDuck .head{
    position:absolute;
    width:19px;
    height:19px;
    background:#f8df82;
    border-radius:50%;
    left:18px;
    top:0;
}

.logoDuck .eye{
    position:absolute;
    width:3px;
    height:3px;
    background:#50483f;
    border-radius:50%;
    left:30px;
    top:6px;
}

.logoDuck .beak{
    position:absolute;
    width:8px;
    height:5px;
    background:#e5a148;
    border-radius:80%;
    left:35px;
    top:9px;
}

.streak{
    background:var(--yellowLight);
    border:1px solid #efdda8;
    padding:9px 15px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
}

/* LAYOUT */

.app{
    max-width:1450px;
    margin:auto;
    display:flex;
}

.sidebar{
    width:245px;
    min-height:calc(100vh - 76px);
    padding:25px 18px;
    background:rgba(255,253,248,.62);
    border-right:1px solid var(--line);
}

.sideTitle{
    margin:6px 12px 12px;
    color:#a0988e;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.languageButton{
    width:100%;
    border:0;
    background:transparent;
    color:var(--brown);
    padding:12px 13px;
    border-radius:13px;
    font:inherit;
    font-weight:600;
    text-align:left;
    cursor:pointer;
}

.languageButton:hover{background:#f5f0e7}

.languageButton.active{
    background:var(--sageLight);
    color:#4f7157;
}

.unitList{margin-top:25px}

.unit{
    padding:9px 11px;
    margin:3px 0;
    border-radius:11px;
    color:#786f65;
    font-size:12px;
    cursor:pointer;
}

.unit:hover{background:#f5f0e7}

.unit.current{
    background:#e8f2e5;
    color:#55765b;
    font-weight:700;
}

.unit.locked{
    opacity:.35;
    cursor:not-allowed;
}

.unitNumber{
    display:inline-block;
    width:25px;
    color:#aaa095;
    font-size:10px;
}

main{
    flex:1;
    min-width:0;
    padding:40px clamp(22px,5vw,65px);
}

/* DASHBOARD */

.page{
    max-width:930px;
    margin:auto;
}

.welcome{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:25px;
    margin-bottom:29px;
}

.welcome h2{
    font:600 clamp(32px,5vw,48px)/1.02 "Playfair Display",serif;
    margin:0 0 9px;
}

.welcome p{
    color:var(--muted);
    margin:0;
}

.progressBox{width:190px}

.progressLabel{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    font-weight:800;
    margin-bottom:7px;
}

.progress{
    height:8px;
    background:#ece5da;
    border-radius:10px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    background:var(--sageDark);
    border-radius:inherit;
    transition:.5s;
}

.cards{
    display:grid;
    grid-template-columns:1.3fr .7fr;
    gap:17px;
    margin-bottom:20px;
}

.card{
    background:rgba(255,255,255,.78);
    border:1px solid var(--line);
    border-radius:23px;
    padding:25px;
    box-shadow:var(--shadow);
}

.continueCard{
    background:linear-gradient(135deg,#e4f0e1,#fff7dc);
}

.kicker{
    color:var(--sageDark);
    font-size:10px;
    font-weight:800;
    letter-spacing:1.4px;
    text-transform:uppercase;
}

.card h3{
    font:600 24px "Playfair Display",serif;
    margin:8px 0;
}

.card p{
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
}

.button{
    border:0;
    background:var(--sageDark);
    color:white;
    padding:12px 18px;
    border-radius:12px;
    font:inherit;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.button:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 18px rgba(98,136,107,.23);
}

.statsCard{
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.stat{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px dashed #e6ded1;
    font-size:13px;
}

.stat:last-child{border:0}

.stat span{color:var(--muted)}

/* DUCK AREA */

.duckArea{
    height:145px;
    position:relative;
    overflow:hidden;
    margin:18px 0 27px;
    border:1px solid #efdfb8;
    border-radius:23px;
    background:linear-gradient(135deg,#fff5d4,#fff9e8);
}

.duckNote{
    position:absolute;
    color:#c9b27b;
    font:20px Georgia,serif;
}

.duck{
    width:65px;
    height:58px;
    position:absolute;
    cursor:pointer;
    transition:.2s;
    z-index:5;
}

.duck:hover{
    transform:scale(1.08) rotate(-4deg);
}

.duck .body{
    position:absolute;
    width:44px;
    height:32px;
    background:#f4d76e;
    border-radius:55%;
    bottom:5px;
    left:5px;
}

.duck .head{
    position:absolute;
    width:31px;
    height:31px;
    background:#f8df82;
    border-radius:50%;
    top:2px;
    left:29px;
}

.duck .eye{
    position:absolute;
    width:4px;
    height:4px;
    background:var(--brown);
    border-radius:50%;
    top:12px;
    left:48px;
}

.duck .beak{
    position:absolute;
    width:13px;
    height:8px;
    background:#e5a148;
    border-radius:80% 20% 20% 80%;
    top:17px;
    left:55px;
}

.duck .wing{
    position:absolute;
    width:21px;
    height:14px;
    background:#e9cb61;
    border-radius:60%;
    bottom:12px;
    left:21px;
    transform:rotate(-15deg);
}

/* LESSON LIST */

.sectionTitle{
    margin:25px 0 13px;
}

.sectionTitle h3{
    font:600 23px "Playfair Display",serif;
    margin:0;
}

.lessonList{
    display:grid;
    gap:8px;
}

.lesson{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    background:rgba(255,255,255,.75);
    border:1px solid var(--line);
    border-radius:15px;
    transition:.2s;
}

.lesson.unlocked{
    cursor:pointer;
}

.lesson.unlocked:hover{
    transform:translateX(4px);
    box-shadow:0 6px 18px rgba(78,68,55,.07);
}

.lesson.locked{opacity:.43}

.lessonNumber{
    width:35px;
    height:35px;
    flex:0 0 35px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1ede5;
    border-radius:11px;
    font-size:11px;
    font-weight:800;
}

.lesson.completed .lessonNumber{
    background:var(--sage);
    color:white;
}

.lessonInfo{flex:1}

.lessonTitle{
    font-size:14px;
    font-weight:700;
}

.lessonSub{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.arrow{color:#a59d93}

/* LESSON */

.lessonPage{
    max-width:850px;
    margin:auto;
}

.back{
    border:0;
    background:transparent;
    padding:0;
    margin-bottom:22px;
    color:var(--sageDark);
    font:inherit;
    font-weight:800;
    cursor:pointer;
}

.lessonHeader{
    padding:31px;
    border:1px solid #dfe8db;
    border-radius:25px;
    background:linear-gradient(135deg,#e7f2e3,#fff7dd);
    margin-bottom:19px;
}

.tag{
    display:inline-block;
    padding:6px 10px;
    background:rgba(255,255,255,.7);
    border-radius:9px;
    color:var(--sageDark);
    font-size:10px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
}

.lessonHeader h2{
    font:600 clamp(31px,5vw,44px)/1.05 "Playfair Display",serif;
    margin:14px 0 8px;
}

.lessonHeader p{
    color:var(--muted);
    margin:0;
}

.lessonContent{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:23px;
    padding:31px;
    box-shadow:var(--shadow);
}

.lessonContent h3{
    font:600 24px "Playfair Display",serif;
    margin:0 0 10px;
}

.lessonContent p{
    color:#665e55;
    line-height:1.72;
    font-size:15px;
}

.codeLabel{
    margin-top:25px;
    margin-bottom:7px;
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.codeBox{
    margin:0;
    padding:21px;
    background:var(--dark);
    color:#f7f3e8;
    border-radius:15px;
    overflow-x:auto;
    font:14px/1.65 Consolas,Monaco,monospace;
    white-space:pre;
}

.challenge{
    margin-top:19px;
    padding:17px;
    background:#f0f5ef;
    border:1px solid #dce8d8;
    border-radius:13px;
}

.challenge strong{
    color:var(--sageDark);
}

.challenge p{
    margin:7px 0 0;
    font-size:13px;
}

.tip{
    margin-top:14px;
    padding:15px 17px;
    background:var(--yellowLight);
    border-left:4px solid #e7c867;
    border-radius:10px;
    color:#6e614b;
    font-size:13px;
    line-height:1.5;
}

.actions{
    margin-top:24px;
    padding:19px;
    border:1px solid #d8e5d4;
    border-radius:17px;
    background:#eef6eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.actions strong{
    display:block;
    margin-bottom:3px;
}

.actions span{
    color:var(--muted);
    font-size:12px;
}

/* TEST */

.testScreen{
    max-width:700px;
    margin:25px auto;
}

.testCard{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:27px;
    padding:35px;
    box-shadow:var(--shadow);
}

.testCard h2{
    font:600 35px "Playfair Display",serif;
    margin:8px 0;
}

.testCard>p{
    color:var(--muted);
    line-height:1.65;
}

.testProgress{
    height:7px;
    background:#ece5da;
    border-radius:10px;
    overflow:hidden;
    margin:25px 0;
}

.testProgressBar{
    height:100%;
    background:var(--sageDark);
}

.question{
    font-size:19px;
    line-height:1.45;
    font-weight:700;
    margin-bottom:17px;
}

.answers{
    display:grid;
    gap:9px;
}

.answer{
    border:1px solid #e6ded2;
    background:#fffdf8;
    color:var(--brown);
    padding:14px 15px;
    border-radius:13px;
    font:inherit;
    text-align:left;
    cursor:pointer;
}

.answer:hover{
    border-color:#b4ccb7;
    background:#f0f6ee;
}

/* FINISHED */

.finished{
    max-width:650px;
    margin:45px auto;
    text-align:center;
}

.finishedCard{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:28px;
    padding:45px 30px;
    box-shadow:var(--shadow);
}

.finishedCard h2{
    font:600 40px "Playfair Display",serif;
    margin:0 0 10px;
}

.finishedCard p{
    color:var(--muted);
    line-height:1.7;
}

/* CONFETTI */

.confetti{
    position:fixed;
    width:8px;
    height:12px;
    z-index:999;
    pointer-events:none;
    animation:confetti .9s ease-out forwards;
}

@keyframes confetti{
    to{
        transform:translate(var(--x),var(--y)) rotate(500deg);
        opacity:0;
    }
}

@media(max-width:800px){
    header{padding:0 16px}
    .sidebar{display:none}
    main{padding:25px 16px}
    .cards{grid-template-columns:1fr}
    .welcome{display:block}
    .progressBox{width:100%;margin-top:20px}
    .actions{flex-direction:column;align-items:stretch}
    .actions .button{width:100%}
    .lessonContent,.testCard{padding:23px}
}
</style>
</head>

<body>

<!-- OPENING -->

<div id="intro">

    <div class="introCode">
        <span>print("Hello, coder!")</span>
        <span>const creativity = true;</span>
        <span>&lt;button&gt;Create!&lt;/button&gt;</span>
        <span>if (idea) { buildSomething(); }</span>
    </div>

    <div class="introContent">

        <div class="introDuck">
            <div class="body"></div>
            <div class="head"></div>
            <div class="eye"></div>
            <div class="beak"></div>
            <div class="wing"></div>
        </div>

        <h1 class="introTitle">
            Remember How to <span>Code</span>
        </h1>

        <p class="introSubtitle">
            Learn it. Practice it. Build something cool.
        </p>

        <div class="loading">
            <div class="loadingFill"></div>
        </div>

    </div>
</div>

<header>

    <div class="logo">

        <div class="logoDuck">
            <div class="body"></div>
            <div class="head"></div>
            <div class="eye"></div>
            <div class="beak"></div>
        </div>

        <h1>
            Remember How to <span>Code</span>
        </h1>

    </div>

    <div class="streak">
        ✦ <span id="streak">0</span> day streak
    </div>

</header>

<div class="app">

<aside class="sidebar">

    <div class="sideTitle">Languages</div>

    <button class="languageButton active" onclick="changeLanguage('Python')">
        Python
    </button>

    <button class="languageButton" onclick="changeLanguage('JavaScript')">
        JavaScript
    </button>

    <button class="languageButton" onclick="changeLanguage('HTML')">
        HTML
    </button>

    <button class="languageButton" onclick="changeLanguage('CSS')">
        CSS
    </button>

    <div class="unitList">

        <div class="sideTitle">Your units</div>

        <div id="units"></div>

    </div>

</aside>

<main id="main"></main>

</div>

<script>

/* =========================================================
   COURSE DATA
   Every entry is a real individual lesson.
========================================================= */

const courses = {

Python: [

[
["What is Python?","Python is a programming language designed to make instructions readable. You write statements and Python follows them in order.","print(\"Hello, world!\")","Change the message to something completely different.","Python is case-sensitive."],
["Your first print()","print() sends information to the screen. It is one of the easiest ways to see what your program is doing.","print(\"I am learning Python!\")","Print your name and favorite hobby.","Strings go inside quotation marks."],
["How Python runs","Python normally runs statements from top to bottom. The order of your instructions can change the result.","print(\"First\")\nprint(\"Second\")\nprint(\"Third\")","Swap the order of the three messages.","Programs follow instructions in order."],
["Numbers","Python can work with whole numbers and decimals without putting them in quotation marks.","print(12)\nprint(3.5)","Print three different numbers.","Numbers and text are different types of data."],
["Strings","A string is text. Python recognizes text because it is surrounded by quotation marks.","print(\"Coding is fun\")","Create a string containing a sentence about yourself.","Spaces inside a string are part of the string."],
["Comments","Comments are notes for humans. Python ignores them when it runs the program.","# This is a comment\nprint(\"Hello\")","Add two comments explaining your code.","Start a Python comment with #."],
["Reading an error","Errors are messages that help you find problems. Learning to read them is an important coding skill.","print(\"Hello\"\n","Create the missing part that fixes the example.","The last line of an error often gives a useful clue."],
["Multiple instructions","A program can contain many statements. Each statement can perform a different job.","print(\"Name: Abby\")\nprint(\"Age: 13\")\nprint(\"Hobby: music\")","Add another line for a skill you have.","Small statements can combine into larger programs."],
["Code formatting","Readable code is easier to understand and fix. Consistent indentation becomes especially important later.","print(\"Start\")\nprint(\"Learning\")\nprint(\"Finish\")","Put these ideas into a short three-line program of your own.","Readable code is easier to debug."],
["Unit 1 review","You now know the basic pieces of a Python program: output, strings, numbers, comments, and simple errors.","message = \"I can code!\"\nprint(message)","Write a tiny program using at least three Unit 1 ideas.","Don't worry about memorizing everything immediately."]
],

[
["What is a variable?","A variable gives a name to information so you can use that information later.","name = \"Abby\"\nprint(name)","Create a variable called favoriteColor.","A variable name should describe what it stores."],
["Changing a variable","Variables can be reassigned. The same name can refer to a new value later in the program.","score = 5\nscore = 10\nprint(score)","Start a score at 0 and change it twice.","The newest assignment is the value Python uses."],
["Addition","Python can perform arithmetic directly with numbers.","total = 8 + 7\nprint(total)","Calculate the total of two numbers you choose.","The + operator adds numbers."],
["Subtraction","The minus operator subtracts one number from another.","difference = 20 - 6\nprint(difference)","Calculate how many items remain after removing some.","Arithmetic can be stored in variables."],
["Multiplication","The * operator multiplies numbers.","points = 4 * 5\nprint(points)","Calculate a score using multiplication.","Use * rather than a multiplication symbol."],
["Division","The / operator divides numbers and normally produces a decimal result.","average = 10 / 4\nprint(average)","Divide a number of items into equal groups.","Python can store decimal answers."],

["Array length","The length property tells you how many items an array contains.","let colors=[\"pink\",\"green\",\"blue\"];\nconsole.log(colors.length);","Find the length of your own array.","length is especially useful with loops."],
["push()","push() adds an item to the end of an array.","let foods=[\"pizza\"];\nfoods.push(\"cake\");","Add two foods.","push changes the original array."],
["pop()","pop() removes the final item from an array.","let foods=[\"pizza\",\"cake\"];\nfoods.pop();","Remove the last item from a list.","pop returns the removed item."],
["shift()","shift() removes the first array item.","let queue=[\"A\",\"B\",\"C\"];\nqueue.shift();","Remove the first item.","shift changes indexes of remaining items."],
["unshift()","unshift() adds an item to the beginning.","let queue=[\"B\",\"C\"];\nqueue.unshift(\"A\");","Add an item to the beginning.","Use it when order matters."],
["includes()","includes() checks whether an array contains a value.","let colors=[\"pink\",\"green\"];\nconsole.log(colors.includes(\"pink\"));","Check for something else.","includes returns true or false."],
["indexOf()","indexOf() tells you where a value occurs.","let colors=[\"pink\",\"green\",\"blue\"];\nconsole.log(colors.indexOf(\"green\"));","Find another item's position.","If a value isn't found, indexOf returns -1."],
["map()","map() creates a new array by transforming every item.","let numbers=[1,2,3];\nlet doubled=numbers.map(n=>n*2);","Create a new array of squared numbers.","map does not need to change the original array."],
["filter()","filter() creates a new array containing items that pass a test.","let scores=[40,80,95];\nlet passing=scores.filter(s=>s>=70);","Filter a list of numbers.","filter is great for selecting data."],
["Unit 6 review","Arrays become powerful when combined with methods such as map, filter, push, and includes.","let numbers=[1,2,3,4];\nlet even=numbers.filter(n=>n%2===0);","Create your own filtered array.","Learn methods one at a time."]
],

[
["Objects","Objects group related information into named properties.","const person={name:\"Abby\",age:13};","Create an object for a favorite character.","Objects use curly braces."],
["Reading properties","Dot notation retrieves an object's property.","const person={name:\"Abby\",age:13};\nconsole.log(person.name);","Print another property.","Property names act like labels."],
["Changing properties","Object properties can be reassigned.","const game={score:10};\ngame.score=25;","Change a game property.","Objects can represent changing state."],
["Adding properties","You can add a new property by assigning it.","const pet={name:\"Bailey\"};\npet.age=4;","Add two properties.","Objects don't need every property at creation."],
["Object methods","A property can store a function. That function is called a method.","const player={\n    sayHi(){ console.log(\"Hi!\"); }\n};\nplayer.sayHi();","Add another method.","Methods describe behavior belonging to an object."],
["Nested objects","Objects can contain other objects.","const player={\n    name:\"Abby\",\n    stats:{score:100}\n};\nconsole.log(player.stats.score);","Add another nested property.","Nested data is common in apps."],
["Destructuring","Destructuring lets you pull properties into variables.","const person={name:\"Abby\",age:13};\nconst {name,age}=person;","Destructure two properties from your own object.","It can make code shorter and clearer."],
["Spread syntax","The spread operator can copy or combine object data.","const a={name:\"Abby\"};\nconst b={...a,age:13};","Create a new object from another one.","Spread is useful when creating updated data."],
["Object keys","Object.keys() gives you an array of property names.","const person={name:\"Abby\",age:13};\nconsole.log(Object.keys(person));","Print the keys of another object.","Object.keys is useful when exploring data."],
["Unit 7 review","Objects are excellent for representing things with multiple named pieces of information.","const player={name:\"Abby\",score:100};\nplayer.score+=25;","Create your own player object.","Think of objects as labeled containers."]
],

[
["The DOM","The DOM represents a webpage as objects JavaScript can inspect and change.","console.log(document.body);","Think of three parts of a webpage JavaScript could change.","The DOM connects JavaScript to HTML."],
["querySelector()","querySelector() finds the first element matching a CSS selector.","const title=document.querySelector(\"h1\");","Find an element with a class.","CSS selectors work inside querySelector."],
["Changing text","textContent changes the text inside an element.","const title=document.querySelector(\"h1\");\ntitle.textContent=\"Hello!\";","Change a heading on your own page.","JavaScript can update the page instantly."],
["Changing styles","JavaScript can change CSS-related properties through an element's style.","const box=document.querySelector(\".box\");\nbox.style.padding=\"20px\";","Change a different style property.","For larger styling changes, CSS classes are often cleaner."],
["click events","addEventListener() can run code when a user clicks something.","button.addEventListener(\"click\",()=>{\n    console.log(\"Clicked!\");\n});","Make a button respond to a click.","Events are how webpages react to users."],
["Input values","JavaScript can read what a user typed into an input.","const input=document.querySelector(\"input\");\nconsole.log(input.value);","Read a different input.","The value property contains the current text."],
["Class changes","classList lets JavaScript add or remove CSS classes.","box.classList.add(\"active\");","Add a class when a button is clicked.","Classes are a clean bridge between JS and CSS."],
["Timers","setTimeout() runs a function after a delay.","setTimeout(()=>{\n    console.log(\"Done!\");\n},1000);","Change the delay.","Timers are measured in milliseconds."],
["Interactive mini project","Combine a button, DOM selection, an event, and a style change.","button.addEventListener(\"click\",()=>{\n    document.body.classList.toggle(\"dark\");\n});","Turn this into your own interactive effect.","Small interactions can become complete projects."],
["Unit 8 review","JavaScript becomes especially powerful when it controls a webpage through the DOM.","const button=document.querySelector(\"button\");\nbutton.addEventListener(\"click\",()=>{\n    document.querySelector(\"h1\").textContent=\"Clicked!\";\n});","Build your own click interaction.","Try changing only one thing at first."]

[

["State","State is information that describes what is currently happening in your program.","let score=0;\nlet playing=true;","Choose three pieces of state for a game.","State changes as the user interacts."],
["Updating state","Events can change state and then update the interface.","score += 10;\nconsole.log(score);","Make a button add points.","Separate the data from how it is displayed."],
["Game loop thinking","Many interactive projects follow a pattern: input, update, display.","// input\n// update\n// display","Write those three steps for a game idea.","This pattern helps organize projects."],

["Reset buttons","A reset function can return project state to its starting values.","function reset(){\n    score=0;\n}","Decide everything your project should reset.","Resetting is important in games."],
["Project debugging","Use console.log() and small tests to find where your project stops behaving correctly.","console.log(\"score before\",score);\nscore+=10;\nconsole.log(\"score after\",score);","Add a debug message to your project.","Debug one problem at a time."],

["find()","find() returns the first item that passes a test.","const scores=[45,72,91];\nconst result=scores.find(s=>s>70);","Find the first number over 80.","find is useful when you need one matching item."],

HTML: [

[
["What is HTML?","HTML provides the structure of a webpage. Elements tell the browser what different pieces of content mean.","<h1>Hello!</h1>\n<p>Welcome to my website.</p>","Create a heading and paragraph.","HTML describes content; CSS styles it."],
["Headings","Heading elements create titles and organize information.","<h1>Main title</h1>\n<h2>Section title</h2>","Create three levels of headings.","Use heading levels in a logical order."],
["Paragraphs","The p element contains a paragraph of text.","<p>This is my first paragraph.</p>","Write a paragraph about a hobby.","Don't use headings just to make text bigger."],
["Links","The a element creates links to other pages or websites.","<a href=\"https://example.com\">Visit</a>","Create a link to a site you use.","href tells the browser where the link goes."],
["Images","The img element displays an image.","<img src=\"flower.jpg\" alt=\"A flower\">","Add an image with useful alt text.","Images should have meaningful alt text."],
["Lists","ul and ol create unordered and ordered lists.","<ul>\n<li>Violin</li>\n<li>Dance</li>\n</ul>","Make a list of five interests.","Each list item uses li."],
["Comments","HTML comments can explain structure without appearing on the page.","<!-- Navigation goes here -->","Add two useful comments.","Comments can help you find sections later."],
["Line structure","HTML elements can be nested inside other elements.","<section>\n<h2>About</h2>\n<p>Hello!</p>\n</section>","Create your own nested section.","Indent nested elements to make structure clear."],
["Attributes","Attributes provide extra information about an element.","<p class=\"intro\">Hello!</p>","Add a class to two elements.","Attributes go inside the opening tag."],
["Unit 1 review","You now know the basic building blocks of an HTML page.","<h1>My Site</h1>\n<p>Welcome!</p>\n<a href=\"#about\">About</a>","Build a tiny three-element page.","HTML is the structure of your site."]
],

[
["The html element","The html element wraps the entire document.","<html>\n</html>","Create the outer structure of a page.","The html element contains head and body."],
["The head","The head contains information about the document that isn't normally displayed as page content.","<head>\n<title>My Site</title>\n</head>","Add a title to your page.","The title appears in the browser tab."],
["The body","The body contains the visible content of the webpage.","<body>\n<h1>Hello!</h1>\n</body>","Put three visible elements inside body.","Visible page content belongs in body."],
["DOCTYPE","DOCTYPE tells the browser which HTML standard the document follows.","<!DOCTYPE html>","Put the correct DOCTYPE at the top of a page.","It should be the first line."],
["Title","The title element controls the browser tab title.","<title>Abby's Website</title>","Choose a title for your own site.","A good title helps identify a page."],
["Meta charset","The charset declaration tells the browser how to interpret text.","<meta charset=\"UTF-8\">","Add it to a document head.","UTF-8 supports many characters."],
["Viewport","The viewport meta tag helps pages behave properly on phones and tablets.","<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">","Add it to your head.","Responsive pages need a suitable viewport."],
["Semantic structure","Elements such as header, main, and footer communicate meaning.","<header>Top</header>\n<main>Content</main>\n<footer>Bottom</footer>","Structure a pretend website using semantic elements.","Semantic HTML helps people and tools understand pages."],
["Sections","section groups related content into a meaningful part of a page.","<section>\n<h2>About Me</h2>\n<p>Hello!</p>\n</section>","Create two sections for a portfolio.","A section usually has a topic or heading."],
["Unit 2 review","A proper document has a clear structure from DOCTYPE through body content.","<!DOCTYPE html>\n<html>\n<head><title>Site</title></head>\n<body><h1>Hello</h1></body>\n</html>","Build the skeleton of a new webpage.","Start with structure before decoration."]
],

[
["div","div is a generic container used to group content.","<div>\n<h2>Card</h2>\n<p>Text</p>\n</div>","Create two grouped areas.","Use semantic elements when one fits better."],
["span","span groups a small piece of inline content.","<p>This is <span>important</span>.</p>","Wrap one word in a span.","span doesn't create a new block."],
["class","class gives elements a reusable label for styling or scripting.","<p class=\"intro\">Welcome!</p>","Give three elements classes.","A class can be reused many times."],
["id","id gives an element a unique identifier.","<section id=\"about\">About</section>","Give a section a unique id.","An id should normally identify one element."],
["Navigation","nav identifies a group of navigation links.","<nav>\n<a href=\"#home\">Home</a>\n<a href=\"#about\">About</a>\n</nav>","Create a three-link navigation bar.","Navigation helps users move around a site."],
["Main content","main identifies the primary content of a page.","<main>\n<h1>Portfolio</h1>\n<p>My work.</p>\n</main>","Put your main page content inside main.","A page normally has one main element."],
["Header","header usually contains introductory content or navigation.","<header>\n<h1>My Portfolio</h1>\n<nav>Links</nav>\n</header>","Create a header for a pretend site.","Header can contain more than just a heading."],
["Footer","footer usually contains closing information such as copyright or links.","<footer>\n<p>Thanks for visiting!</p>\n</footer>","Create a footer message.","Footer content depends on the site."],
["Article","article represents a self-contained piece of content.","<article>\n<h2>My Project</h2>\n<p>Description...</p>\n</article>","Create an article about something you made.","Articles can stand on their own."],
["Unit 3 review","Containers and semantic elements help organize a page into meaningful sections.","<header>...</header>\n<main><article>...</article></main>\n<footer>...</footer>","Plan a semantic structure for your website.","Good structure makes styling easier later."]
],

[
["Buttons","The button element creates a control the user can interact with.","<button>Click me</button>","Create three different buttons.","JavaScript can make buttons do things."],
["Forms","form groups controls that collect or submit information.","<form>\n<input type=\"text\">\n<button>Send</button>\n</form>","Create a simple form.","Forms are designed for user input."],
["Text inputs","input type=text creates a single-line text field.","<label>Name</label>\n<input type=\"text\">","Create a field for a favorite color.","Labels make forms easier to understand."],
["Labels","label describes a form control.","<label for=\"name\">Name</label>\n<input id=\"name\">","Connect a label to an input.","The for value should match the input id."],

["Radio buttons","Radio buttons let users choose one option from a group.","<label><input type=\"radio\" name=\"size\"> Small</label>\n<label><input type=\"radio\" name=\"size\"> Large</label>","Create a three-choice group.","Radio buttons use the same name to form a group."],
["Select menus","select creates a dropdown list.","<select>\n<option>Red</option>\n<option>Blue</option>\n</select>","Create a dropdown of five choices.","option elements create the choices."],
["Textarea","textarea provides a larger multi-line text field.","<textarea placeholder=\"Write here...\"></textarea>","Create a feedback box.","Textarea is useful for longer messages."],

["Download links","The download attribute can tell the browser a link is intended to download a file.","<a href=\"notes.txt\" download>Download notes</a>","Create a download link to a file in your project.","The file needs to exist at that path."],

[

["Language","The lang attribute tells tools what language the document uses.","<html lang=\"en\">","Add lang to a document.","Language information helps screen readers."],
["Form accessibility","Inputs should have clear labels so users know what information belongs there.","<label for=\"email\">Email</label>\n<input id=\"email\" type=\"email\">","Label three inputs.","Visible labels are usually better than relying only on placeholders."],

["Unit 7 review","Accessibility starts with choosing meaningful HTML and giving users the information they need.","<label for=\"name\">Name</label>\n<input id=\"name\" required>","Audit a small page for three accessibility improvements.","Accessible HTML is good HTML."]

let page="dashboard";

    localStorage.getItem("placements")||"{}"
);

let completed=JSON.parse(
    localStorage.getItem("completed")||"{}"
);

let streak=Number(
    localStorage.getItem("streak")||0
);

document.getElementById("streak").textContent=streak;

/* =========================================================
   HELPERS
========================================================= */

function key(u,l){
    return language+"-"+u+"-"+l;
}

function done(u,l){
    return completed[key(u,l)]===true;
}

function markDone(u,l){
    completed[key(u,l)]=true;
    localStorage.setItem("completed",JSON.stringify(completed));
}

function placement(){
    return placements[language]||null;
}

function course(){
    return courses[language];
}

function totalCompleted(){
    let n=0;

    for(let u=1;u<=10;u++){
        for(let l=1;l<=10;l++){
            if(done(u,l)) n++;
        }
    }

    return n;
}

/* =========================================================
   LOCKING
========================================================= */

function unlocked(u,l){

    const start=placement();

    if(!start)return false;

    if(u<start)return false;

    if(u===start&&l===1)return true;

    if(l>1)return done(u,l-1);

    return done(u-1,10);
}

========================================================= */

function changeLanguage(newLanguage){

    language=newLanguage;

    localStorage.setItem("language",language);

    page=placement()?"dashboard":"test";

    render();
}

function startTest(){

    testIndex=0;
    firstWrong=null;
    page="test";

    render();
}

function answerTest(choice){

    const questions=tests[language];
    const q=questions[testIndex];

    if(choice!==q[1]&&firstWrong===null){
        firstWrong=testIndex+1;
    }

    testIndex++;

    if(testIndex>=10){

        let start;

        if(firstWrong===null){
            start=10;
        }else{
            start=Math.max(1,firstWrong-1);
        }

        placements[language]=start;

        localStorage.setItem(
            "placements",
            JSON.stringify(placements)
        );

        unit=start;
        lesson=1;
        page="dashboard";

        render();
        return;
    }

    render();
}

/* =========================================================
   LESSONS
========================================================= */

function openLesson(u,l){

    if(!unlocked(u,l))return;

    unit=u;
    lesson=l;
    page="lesson";

    render();
}

function completeLesson(){

    markDone(unit,lesson);
    updateStreak();

    render();
}

function nextLesson(){

    markDone(unit,lesson);
    updateStreak();

    if(lesson<10){
        lesson++;
    }else if(unit<10){
        unit++;
        lesson=1;
    }else{
        page="finished";
        render();
        return;
    }

    page="lesson";

    render();
}

function continueLearning(){

    const start=placement();

    for(let u=start;u<=10;u++){

        for(let l=1;l<=10;l++){

            if(unlocked(u,l)&&!done(u,l)){
                unit=u;
                lesson=l;
                page="lesson";
                render();
                return;
            }

        }

    }

    page="finished";
    render();
}

/* =========================================================
   STREAK
========================================================= */

function updateStreak(){

    const today=new Date().toDateString();
    const last=localStorage.getItem("lastCodingDay");

    if(last!==today){

        streak++;

        localStorage.setItem("streak",streak);
        localStorage.setItem("lastCodingDay",today);

        document.getElementById("streak").textContent=streak;
    }
}

/* =========================================================
   DASHBOARD
========================================================= */

    const start=placement();

    <div class="page">

        <div class="welcome">

            <div>
                <h2>Keep coding,<br>keep creating.</h2>
                <p>You're learning ${language}.</p>
            </div>

            <div class="progressBox">

                <div class="progressLabel">
                    <span>Your progress</span>
                    <span>${progress}%</span>
                </div>

                <div class="progress">

                </div>

            </div>

        </div>

        <div class="cards">

            <div class="card continueCard">

                <div class="kicker">Continue learning</div>

                <h3>
                    Unit ${start} · ${course()[start-1][0][0]}
                </h3>

                <p>
                    Your placement test put you here.
                    Finish lessons in order to unlock the next ones.
                </p>

                <button class="button"
                onclick="continueLearning()">

            <div class="card statsCard">

                <div class="stat">

                </div>

                <div class="stat">
                    <span>Lessons</span>

                </div>

                <div class="stat">
                    <span>Streak</span>
                    <strong>${streak} days</strong>
                </div>

            </div>

        </div>

        <div class="duckArea">

            <span class="duckNote"
            style="left:18%;top:25%">♪</span>

            <span class="duckNote"

        <div class="sectionTitle">

        <div class="lessonList">
    `;

    for(let l=1;l<=10;l++){

        const item=course()[start-1][l-1];

        const canOpen=unlocked(start,l);

        html+=`

        <div class="lesson

            `onclick="openLesson(${start},${l})"`:

/* =========================================================
   LESSON PAGE
========================================================= */

function renderLesson(){

    const data=course()[unit-1][lesson-1];

    const title=data[0];
    const explanation=data[1];
    const code=data[2];
    const challenge=data[3];
    const tip=data[4];

    const isDone=done(unit,lesson);

    let nextText="Next Lesson →";

    if(unit===10&&lesson===10){
        nextText="Finish Course ✦";
    }else if(lesson===10){
        nextText="Next Unit →";
    }

    return `

    <div class="lessonPage">

        <button class="back"
        onclick="goDashboard()">
            ← Back to lessons
        </button>

        <div class="lessonHeader">

            <span class="tag">
                ${language} · Unit ${unit}
            </span>

            <h2>${title}</h2>

            <p>
                Lesson ${lesson} of 10
            </p>

        </div>

        <div class="lessonContent">

            <h3>Let's learn it!</h3>

            <p>
                ${explanation}
            </p>

            <div class="codeLabel">
                Example
            </div>

            <pre class="codeBox"
            id="codeBox"></pre>

            <div class="challenge">

                <strong>Your challenge</strong>

                <p>
                    ${challenge}
                </p>

            </div>

            <div class="tip">
                <strong>Little tip:</strong>
                ${tip}

            <div class="actions">

                <div>

                    <strong>
                        ${isDone?
                        "✓ Lesson complete!":
                        "Ready to move on?"}
                    </strong>

                    <span>
                        ${isDone?
                        "You've unlocked the next lesson.":
                        "Complete this lesson to unlock the next one."}
                    </span>

                </div>

                <button class="button"
                onclick="${isDone?

/* =========================================================
   DUCK
========================================================= */

function duck(left,top){

    return `

    <div class="duck"
    style="left:${left}%;top:${top}%"
    onclick="duckClick(this)">

        <div class="body"></div>
        <div class="head"></div>
        <div class="eye"></div>
        <div class="beak"></div>
        <div class="wing"></div>

    </div>
    `;
}

function duckClick(element){

    const rect=element.getBoundingClientRect();

    const x=rect.left+rect.width/2;
    const y=rect.top+rect.height/2;

    const colors=[
        "#f2cbd3",
        "#a9c7ad",
        "#f5d77d",
        "#cfe2ed",
        "#ddd5eb"
    ];

    for(let i=0;i<24;i++){

        const piece=document.createElement("div");

        piece.className="confetti";

        piece.style.background=
            colors[i%colors.length];

        piece.style.left=x+"px";
        piece.style.top=y+"px";

        piece.style.setProperty(
            "--x",
            ((Math.random()*180)-90)+"px"
        );

        piece.style.setProperty(
            "--y",
            ((Math.random()*150)-75)+"px"
        );

        document.body.appendChild(piece);

        setTimeout(()=>{
            piece.remove();
        },950);
    }

    element.style.opacity="0";

    setTimeout(()=>{

        element.style.left=
            (5+Math.random()*82)+"%";

        element.style.top=
            (20+Math.random()*55)+"%";

        element.style.opacity="1";

    },1800);
}

/* =========================================================
   SIDEBAR
========================================================= */

function renderUnits(){

    const box=document.getElementById("units");

    if(!box)return;

    const start=placement();

    if(!start){
        box.innerHTML="";
        return;
    }

    let html="";

    for(let u=1;u<=10;u++){

        const canOpen=
            u>=start &&
            (
                u===start ||
                done(u-1,10)
            );

        html+=`

        <div class="unit
        ${u===unit?"current":""}
        ${canOpen?"":"locked"}"

        ${canOpen?
        `onclick="openUnit(${u})"`:
        ""}>

            <span class="unitNumber">
                ${u}
            </span>

            ${course()[u-1][0][0]}

        </div>

        `;
    }

    box.innerHTML=html;
}

function openUnit(u){

    if(!unlocked(u,1))return;

    for(let l=1;l<=10;l++){

        if(unlocked(u,l)&&!done(u,l)){

            unit=u;
            lesson=l;
            page="lesson";

            render();
            return;
        }
    }
}

/* =========================================================
   NAVIGATION
========================================================= */

function goDashboard(){

    page="dashboard";
    render();

}

/* =========================================================
   RENDER
========================================================= */

function render(){

    const main=document.getElementById("main");

    if(page==="test"){
        main.innerHTML=renderTest();
    }

    else if(page==="lesson"){

        main.innerHTML=renderLesson();

        /*
            IMPORTANT:
            Code goes into textContent, not innerHTML.
            This is what prevents HTML/JS examples
            from breaking the lesson page.
        */

        const box=document.getElementById("codeBox");

        if(box){
            box.textContent=
                course()[unit-1][lesson-1][2];
        }

    }

    else if(page==="finished"){
        main.innerHTML=renderFinished();
    }

    else{
        main.innerHTML=renderDashboard();
    }

    document
        .querySelectorAll(".languageButton")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.textContent.trim()===language
            );

        });

    renderUnits();

    document.getElementById("streak").textContent=streak;
}

/* =========================================================
   INTRO
========================================================= */

setTimeout(()=>{

    document
        .getElementById("intro")
        .classList.add("hide");

},2500);

/* =========================================================
   START
========================================================= */

if(!placement()){
    page="test";
}

render();

</script>
