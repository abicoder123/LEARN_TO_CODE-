let currentLanguage = "python";
let currentLesson = null;

let progressData =
    JSON.parse(localStorage.getItem("codeClubProgress")) || {};

let streakData =
    JSON.parse(localStorage.getItem("codeClubStreak")) || {
        streak: 0,
        lastDate: ""
    };

function save() {
    localStorage.setItem(
        "codeClubProgress",
        JSON.stringify(progressData)
    );

    localStorage.setItem(
        "codeClubStreak",
        JSON.stringify(streakData)
    );
}

function updateStreak() {

    const today = new Date().toISOString().slice(0,10);

    if (streakData.lastDate === today) {
        return;
    }

    const yesterday = new Date();

    yesterday.setDate(yesterday.getDate() - 1);

    const yesterdayString =
        yesterday.toISOString().slice(0,10);

    if (streakData.lastDate === yesterdayString) {
        streakData.streak++;
    } else {
        streakData.streak = 1;
    }

    streakData.lastDate = today;

    save();
}

function languageKey() {
    return currentLanguage;
}

function completedCount() {

    if (!progressData[languageKey()]) {
        return 0;
    }

    return Object.keys(progressData[languageKey()]).length;
}

function isCompleted(unit, lesson) {

    if (!progressData[languageKey()]) {
        return false;
    }

    return progressData[languageKey()][unit + "-" + lesson];
}

function renderUnits() {

    const data = languages[currentLanguage];

    document.getElementById("languageTitle").textContent =
        data.name;

    document.getElementById("languageDescription").textContent =
        data.description;

    const unitsContainer =
        document.getElementById("units");

    unitsContainer.innerHTML = "";

    const jump =
        document.getElementById("unitJump");

    jump.innerHTML = "<strong style='margin-right:5px;'>Jump to:</strong>";

    data.units.forEach((unit, unitIndex) => {

        const jumpButton =
            document.createElement("button");

        jumpButton.className = "jump";

        jumpButton.textContent =
            "Unit " + (unitIndex + 1);

        jumpButton.onclick = function() {

            document
                .getElementById("unit-" + unitIndex)
                .scrollIntoView({
                    behavior: "smooth"
                });

        };

        jump.appendChild(jumpButton);

        const unitElement =
            document.createElement("div");

        unitElement.className = "unit";

        unitElement.id = "unit-" + unitIndex;

        let lessonsHTML = "";

        unit[1].forEach((lessonName, lessonIndex) => {

            const completed =
                isCompleted(unitIndex, lessonIndex);

            lessonsHTML += `
                <button
                    class="lesson ${completed ? "completed" : ""}"
                    onclick="openLesson(${unitIndex}, ${lessonIndex})">

                    <span class="lesson-number">
                        ${completed ? "✓" : lessonIndex + 1}
                    </span>

                    <span class="lesson-name">
                        ${lessonName}
                    </span>

                    ${completed ? '<span class="check">✓</span>' : ""}
                </button>
            `;
        });

        unitElement.innerHTML = `
            <div class="unit-header">
                <div class="unit-number">
                    Unit ${unitIndex + 1}
                </div>

                <div class="unit-title">
                    ${unit[0]}
                </div>
            </div>

            <div class="lessons">
                ${lessonsHTML}
            </div>
        `;

        unitsContainer.appendChild(unitElement);
    });

    updateProgress();
}

function updateProgress() {

    const total = 100;

    const completed = completedCount();

    const percentage =
        Math.round((completed / total) * 100);

    document.getElementById("progressText").textContent =
        percentage + "%";

    document.getElementById("progressFill").style.width =
        percentage + "%";

    document.getElementById("streak").textContent =
        streakData.streak;

    let totalXP = 0;

    Object.keys(progressData).forEach(lang => {

        totalXP +=
            Object.keys(progressData[lang]).length * 10;

    });

    document.getElementById("xp").textContent =
        totalXP;
}

function selectLanguage(language) {

    currentLanguage = language;

    document.querySelectorAll(".language-btn")
        .forEach(button => button.classList.remove("active"));

    const buttons =
        document.querySelectorAll(".language-btn");

    if (language === "python") buttons[0].classList.add("active");
    if (language === "javascript") buttons[1].classList.add("active");
    if (language === "html") buttons[2].classList.add("active");
    if (language === "css") buttons[3].classList.add("active");

    showHome();
    renderUnits();
}

function openLesson(unitIndex, lessonIndex) {

    currentLesson = {
        unit: unitIndex,
        lesson: lessonIndex
    };

    const data = languages[currentLanguage];

    const unit =
        data.units[unitIndex];

    const lesson =
        unit[1][lessonIndex];

    document.getElementById("homePage")
        .style.display = "none";

    document.getElementById("lessonPage")
        .classList.add("show");

    document.getElementById("lessonUnit")
        .textContent =
        "Unit " + (unitIndex + 1) + " · " + unit[0];

    document.getElementById("lessonTitle")
        .textContent =
        lesson;

    document.getElementById("lessonContent")
        .innerHTML =
        makeLessonContent(
            currentLanguage,
            unitIndex,
            lessonIndex,
            lesson
        );

    const button =
        document.getElementById("completeButton");

    if (isCompleted(unitIndex, lessonIndex)) {

        button.textContent =
            "✓ Lesson completed";

        button.style.background =
            "#aaa";

    } else {

        button.textContent =
            "Mark lesson complete";

        button.style.background =
            "#6b8f71";
    }

    updateStreak();
}

function showHome() {

    document.getElementById("lessonPage")
        .classList.remove("show");

    document.getElementById("homePage")
        .style.display = "block";

    renderUnits();
}

function completeLesson() {

    if (!currentLesson) return;

    if (!progressData[currentLanguage]) {
        progressData[currentLanguage] = {};
    }

    const key =
        currentLesson.unit +
        "-" +
        currentLesson.lesson;

    if (!progressData[currentLanguage][key]) {

        progressData[currentLanguage][key] = true;

        save();

        updateStreak();
    }

    const button =
        document.getElementById("completeButton");

    button.textContent =
        "✓ Lesson completed";

    button.style.background =
        "#aaa";

    updateProgress();
}

function makeLessonContent(language, unit, lesson, title) {

    const lessonsInUnit =
        languages[language].units[unit][1];

    let description =
        "In this lesson, you will learn about " +
        title.toLowerCase() +
        " and see how it is used when writing real code.";

    let code = "";

    if (language === "python") {

        code =
`# Python example

name = "Alex"
print("Hello, " + name)`;

    }

    if (language === "javascript") {

        code =
`// JavaScript example

const name = "Alex";
console.log("Hello, " + name);`;

    }

    if (language === "html") {

        code =
`<!DOCTYPE html>
<html>
<body>

<h1>Hello!</h1>
<p>My first webpage.</p>

</body>
</html>`;

    }

    if (language === "css") {

        code =
`body {
    background: #f5f5f5;
    font-family: Arial;
}

h1 {
    color: #456a4d;
}`;

    }

    let lessonNumber =
        lesson + 1;

    let extra =
        `
        <h2>What you are learning</h2>

        <p>
            This is lesson ${lessonNumber} of this unit.
            The goal is to understand the idea first,
            then see how it appears in actual code.
        </p>

        <div class="example">
            <strong>Think about it:</strong><br>
            Good programmers do not just memorize code.
            They understand what each part is doing.
        </div>

        </p>

        <h2>Remember</h2>

        <p>
            You do not need to memorize everything immediately.
            Focus on understanding what the code means and why it works.
        </p>
        `;

    return `
        <p>${description}</p>
        ${extra}
    `;
}

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}
